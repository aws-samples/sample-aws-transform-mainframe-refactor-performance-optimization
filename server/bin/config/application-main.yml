report:
  output:
    path:
      template: "Reports/{PROGID}"
    name:
      template: "{PRINTERNAME}_{DATE}{TIME}"
    name.override:
      template: "{PRINTERNAME}-{USRDTA}-{DATE}{TIME}"
    jobNumber:
      default: "000000"
    jobName:
      default: "Interactive"
    time:
      format: HHmmss
    date:
      format: yyyyMMdd
reportFormat: PDF

#### DEFAULT APPLICATION-MAIN.YML FILE      #####
#### SHOWING USEFULL CONFIGURATION ELEMENTS #####
#### SHOULD BE OVERRIDED AND EXTERNALIZED   #####

#################################
##### Logging configuration #####
#################################
logging:
  config: classpath:logback-main.xml
  level:
    org.springframework.beans.factory.support.DefaultListableBeanFactory: WARN
    # Brave: default tracing implementation for GapWalk distributed tracing
    brave.Tracer: WARN
################################
##### Spring configuration #####
################################
spring:
  quartz:
    auto-startup: false
    scheduler-name: Default
    properties:
      org.quartz.threadPool.threadCount: 1
  jta:
    enabled: false
    atomikos.properties.maxTimeout : 600000 
    atomikos.properties.default-jta-timeout : 100000 
  jpa:
# DISABLE OpenEntityManagerInViewInterceptor  
    open-in-view: false
    # Fix Postgres JPA Error:
    # Method org.postgresql.jdbc.PgConnection.createClob() is not yet implemented.
    properties.hibernate.temp.use_jdbc_metadata_defaults : false
#####################################
##### Jics tables configuration #####
#####################################

    # The dialect should match the jics datasource choice
    database-platform : org.hibernate.dialect.PostgreSQLDialect # org.hibernate.dialect.PostgreSQLDialect, org.hibernate.dialect.SQLServerDialect
    
    # those properties can be used to create and initialize jics tables automatically.
