################################################
##### SQL Date / time formats configuration ####
################################################

# DB to PGM - The dateTimeFormat [ISO-EUR-JIS-USA-LOCAL] describes how to spill database date time timestamp type into data simplifier entities
# Here after are the default values
#dateTimeFormat : ISO

# To specified you owned output format, set datetimeFormat to LOCAL and some of following properties :
# Here after are the default values
#pgmDateFormat : yyyy-MM-dd
#pgmTimeFormat : HH.mm.ss
#pgmTimestampFormat : yyyy-MM-dd-HH.mm.ss.SSSSSS

# PGM to DB - First, dateTimeFormat is used to interpret PGM value as recognized formats, then interpreted value is formated to expected target database format.
# Here after are the default values
#dbDateFormat : yyyy-MM-dd
#dbTimeFormat : HH:mm:ss
#dbTimestampFormat : yyyy-MM-dd HH:mm:ss.SSSSSS
#dbDateFormat : dd.MM.yyyy
#dateTimeFormat : EUR

######################
##### CALLS GRAPH ####
######################
callGraph : false

###############################
##### SQL SHIFT CODE POINT ####
###############################
# Code point 384 match unicode character \u0180
sqlCodePointShift : 384 

###############################
##### LOCK TIMEOUT RECORD  ####
###############################
# Blu4IV record lock timeout 
lockTimeout : 100

########################################################################
####                  	 REPORTS OUTPUT CONFIG               		####
#### Specify the report output configuration utilizing predefined 	####
#### place-holders.				  		        					####
####                                                  				####
#### Possible placeholder values: 									####
#### {USERNAME} 	: Fetched from SharedContext 					####
#### {JOBNUMBER} 	: Will be the number of the job if within a		####
####				  quartz job execution, default otherwise		####
#### {PROGID}		: The entry point program id					####
#### {JOBNAME}		: Will be the name of the job if within a 		####
####			 	  quartz job execution, default otherwise		####
#### {PRINTERNAME}	: The name of the printer, ideally should only	####
####				  be used for reportNameTemplate.				####
#### {USRDTA}		: The value provided for USRDTA parameter 		####
####				  during an override (OVRPRTF). 				####
####				  Can only be used for							####
####                  report.output.name.override.template			####
#### {DATE}			: The current date in specified format using	####
####				  report.output.date.format						####
#### {TIME}   		: The current time in specified format using	####
####				  report.output.time.format						####
####																####
#### The report report.output.name.override.template is only 		####
#### considered when an override has been performed on a printer	####
#### file AND USRDTA parameter was specified.						####
####																####
#### Default values if not specified:								####
####	report.output.path.template: "/reports/{PROGID}"			####
####	report.output.name.template: "{PRINTERNAME}_{DATE}{TIME}"	####
####	report.output.name.override.template: 						####
####    "{PRINTERNAME}-{USRDTA}-{DATE}{TIME}"						####
####	report.output.jobNumber.default: 000000						####
####	report.output.jobName.default: "Interactive"				####
####	report.output.time.format: HHmmss							####
####	report.output.date.format: yyyyMMdd							####
####	reportFormat: PDF											####
########################################################################
#report.output.path.template: "/reports/{PROGID}"
#report.output.name.template: "{PRINTERNAME}_{DATE}{TIME}"
#report.output.name.override.template: "{PRINTERNAME}-{USRDTA}-{DATE}{TIME}"
#report.output.jobNumber.default: "000000"
#report.output.jobName.default: "Interactive"
#report.output.time.format: HHmmss
#report.output.date.format: yyyyMMdd
#reportFormat: PDF

##############################
##### TASK EXECUTOR       ####
##############################
taskExecutor: 
  corePoolSize: 5
  maxPoolSize: 200
  queueCapacity: 0
  allowCoreThreadTimeOut: false
  
##############################
##### PROGRAM NOT FOUND   ####
##############################
stopExecutionWhenProgNotFound: true

######################################################
#####  DISP DEFAULT VALUE (to be removed one day) ####
######################################################
defaultKeepExistingFiles: true

#############################################################################
#####  THRU FILE BUILDERS WRITES INTO DEDICATED LOGGER INSTEAD OF SYSOUT ####
#############################################################################
#file.stdoutIntoLogger: false

#####################################
#####  JOBQUEUE CONFIGURATION    ####
#####################################
jobqueue:
  api.enabled: false
  impl: none # possible values: quartz, none
  logging.quartz.jobDiscriminator: none # possible values: none or template
  interrupt.delay: 30 # maximum 30 seconds
  interrupt.standby: false	# whether to put scheduler in standby mode after all jobs successfully interrupt
  schedulers:  # list of schedulers
    -
      name: queue1
      threadCount: 5
    -
      name: queue2
      threadCount: 5
      
################################################################################
##### QUERY BUILDING                                                          ##
# useConcatCondition : false by default 
# if true, in the query, the where condition is build with key concatenation  ##
################################################################################
# query.useConcatCondition: true      

####################################
#####  CONTEXT PRE CONSTRUCT    ####
####################################
context.preconstruct.enable: false
context.preconstruct.parallelism: 10
context.preconstruct.frequencyInMillis: 100

################################################################################
###  MESSAGE QUEUE CONFIGURATION                                              ##
# Message queues are disabled by default, should be enabled per project need  ##
################################################################################
blu4ivmq:
  queues.enabled: false
  # queues.broker: rabbitmq
  # queues.rabbitMQHost: localhost
  # queues.rabbitMQVirtualHost: /
  # queues.rabbitMQPort: 5672
  # queues.rabbitMQUsername: guest
  # queues.rabbitMQPassword: guest
  allowedTypes: INFO,STATUS,NOTIFY,INQ #possible values: INFO, STATUS, NOTIFY, INQ, ESCAPE, DIAG, RQS, COMP

########################################
#####  JCL Batch Restart Mechanism  ####
########################################
jcl:
  checkpoint:
    enabled: false
    # provider: redis
    # redis:
    #   hostname: 127.0.0.1
    #   port: 6379
    #   password: 
    #   username: 
    #   mode: standalone
#################################################
#####  JCL Null Statement(NULLJCL) Handling  ####
##### When true,  // ends job (EOF mode);    ####
##### When false, // is ignored (IGNORE mode)####
#################################################
jcl.nullJclEof: true
##########################################################
#                Gapwalk database support                #
# useSavePointToRestoreFail: false by default            #
#   -true, save point will be created before an insert   #
#     statement unless excluded in queries.mapping       #
#   -false, save point will be created before an insert  #
#     only if included in queries.mapping                #
##########################################################
gapwalk:
  database:
    support:
      useSavePointToRestoreFail: false
  ratelimiting:
    enabled: false
    requestsPerMinute: 1000
    burstCapacity: 1500
    includeHeaders: true

########################################################################
#                       Blu4iv Data Access Config                      #
# useOldDaoDesign: A global flag that determines if the application is #
#                  to use the old DAO architecture or the new. This is # 
#                  dependent on whether the DAO's were generated using #
#                  old or new design. This setting can be overwritten  #
#                  on program and call level if need be.               #
#                  For old(true):  DAO's must be registered using the  #
#                                  DAOManager.registerOldDAO method    #
#                  For new(false): DAO's must be registered using the  #
#                                  DAOManager.registerDAO method       # 
#                  Default value: false                                #
########################################################################
blu4iv.dataaccess.useOldDaoDesign: false
gapwalk.tracing.enabled: false